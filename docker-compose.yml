name: atm-simulator

services:
  db:
    image: postgres:17-alpine
    container_name: atm-simulator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm
      POSTGRES_DB: atm_simulator
    ports:
      - "5432:5432"
    volumes:
      - atm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm -d atm_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the whole app in containers with `docker compose --profile app up -d --build`.
  # Plain `docker compose up -d` starts only the database for local development.
  app:
    profiles: ["app"]
    build: .
    container_name: atm-simulator-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://atm:atm@db:5432/atm_simulator
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  atm-db-data:
